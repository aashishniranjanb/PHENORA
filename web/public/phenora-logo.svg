<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <!-- Brand Mark -->
  <!-- Wave to Digital Block Design -->
  <g transform="translate(10, 15)">
    <!-- Base Wave (Analog) -->
    <path d="M 0,25 C 10,5 20,45 30,25 C 40,5 50,45 60,25" fill="none" stroke="#17B169" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Transition Block 1 -->
    <rect x="68" y="10" width="8" height="30" rx="2" fill="#17B169" opacity="0.6"/>
    <!-- Transition Block 2 -->
    <rect x="80" y="5" width="8" height="40" rx="2" fill="#17B169" opacity="0.8"/>
    <!-- Transition Block 3 -->
    <rect x="92" y="0" width="10" height="50" rx="2" fill="#17B169"/>
  </g>

  <!-- Typography -->
  <text x="130" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="3">PHENORA</text>
  <text x="130" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="9" fill="#17B169" letter-spacing="1.5">ADAPTIVE IMPEDANCE INTELLIGENCE</text>
</svg>

